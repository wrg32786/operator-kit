name: release

on:
  workflow_run:
    workflows: [validate]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        if: steps.release.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?\n(?P<body>.*?)(?=^## \[|\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if not match:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          notes = match.group("body").strip() + "\n"
          Path("/tmp/operator-kit-release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Publish GitHub release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TARGET: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "$TAG" \
            --target "$TARGET" \
            --title "AIgent Operator Kit $TAG" \
            --notes-file /tmp/operator-kit-release-notes.md
